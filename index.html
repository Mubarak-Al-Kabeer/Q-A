<!-- =========================
     GAME SETUP
========================== -->

<section id="gameScreen" class="screen">

  <header class="topbar">

    <div class="player-info">

      <h2>
        🚑 سين جيم الطبي
      </h2>

      <span id="playerNickname"></span>

    </div>

    <div class="games-info">

      الألعاب المتبقية:

      <strong id="gamesRemaining">
        0
      </strong>

    </div>

    <button
      class="logout-button"
      onclick="logout()"
    >
      خروج
    </button>

  </header>


  <!-- =========================
       ADMIN CONTROL MENU
  ========================== -->

  <div
    id="adminMenu"
    class="admin-menu"
    style="display:none;"
  >

    <h2>⚙️ لوحة المسؤول</h2>

    <p>
      اختر القسم الذي تريد الدخول إليه
    </p>

    <div class="admin-options">

      <button
        class="admin-option control-option"
        onclick="showAdminPanel()"
      >

        <span class="admin-option-icon">
          👥
        </span>

        <span class="admin-option-title">
          لوحة الحسابات
        </span>

        <span class="admin-option-description">
          إدارة الحسابات والموافقات
        </span>

      </button>


      <button
        class="admin-option game-option"
        onclick="showGameSetup()"
      >

        <span class="admin-option-icon">
          🎮
        </span>

        <span class="admin-option-title">
          دخول اللعبة
        </span>

        <span class="admin-option-description">
          تجهيز مباراة جديدة
        </span>

      </button>

    </div>

  </div>


  <!-- =========================
       NORMAL GAME SETUP
  ========================== -->

  <div
    id="gameSetupArea"
    class="card game-card"
  >

    <div
      id="adminBackButton"
      style="display:none;"
    >

      <button
        class="secondary"
        onclick="showAdminMenu()"
      >
        ← رجوع للوحة المسؤول
      </button>

    </div>


    <h2>
      تجهيز اللعبة
    </h2>

    <p class="subtitle">
      أدخل أسماء الفريقين للبدء
    </p>


    <input
      id="team1"
      type="text"
      placeholder="اسم الفريق الأول"
    >


    <input
      id="team2"
      type="text"
      placeholder="اسم الفريق الثاني"
    >


    <button onclick="startGame()">
      🚀 ابدأ اللعبة
    </button>


    <div
      id="gameMessage"
      class="message"
    ></div>

  </div>


  <!-- =========================
       ADMIN PANEL
  ========================== -->

  <div
    id="adminPanel"
    class="admin-panel"
    style="display:none;"
  >

    <div class="admin-panel-header">

      <div>

        <h2>
          👥 لوحة الحسابات
        </h2>

        <p>
          إدارة حسابات اللاعبين
        </p>

      </div>

      <button
        class="secondary"
        onclick="showAdminMenu()"
      >
        ← رجوع
      </button>

    </div>


    <div class="admin-stats">

      <div class="admin-stat">
        <span>إجمالي الحسابات</span>
        <strong id="totalAccounts">0</strong>
      </div>

      <div class="admin-stat">
        <span>بانتظار الموافقة</span>
        <strong id="pendingAccounts">0</strong>
      </div>

      <div class="admin-stat">
        <span>الحسابات المقبولة</span>
        <strong id="approvedAccounts">0</strong>
      </div>

    </div>


    <div
      id="accountsList"
      class="accounts-list"
    >

      <div class="loading">
        جاري تحميل الحسابات...
      </div>

    </div>

  </div>

</section>
